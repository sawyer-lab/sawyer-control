[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sawyer-control"
version = "0.1.0"
description = "Standalone gRPC control platform for Rethink Sawyer robots."
requires-python = ">=3.8"
dependencies = ["grpcio>=1.66.2", "numpy>=1.24", "protobuf>=5.27"]

[project.optional-dependencies]
bridge = []
dev = ["grpcio-tools==1.66.2", "pytest>=8", "matplotlib>=3.7"]
# The demo tools under scripts/demo plot their results.
demo = ["matplotlib>=3.7"]

[project.scripts]
sawyer-control = "sawyer_control.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
